[project]
name = "packed-eegnet"
version = "0.1.0"
description = "Train many EEGNets at once as one packed network, with a cheaper first block"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
# conversion to and from braindecode's EEGNet
braindecode = [
    "braindecode>=1.2",
]
# everything recipes/ needs
recipes = [
    "braindecode>=1.2",
    "moabb>=1.1",
    "pyyaml>=6",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "braindecode>=1.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# EEGNet on Lee2019_ERP (OpenBMI), P300 speller (target vs non-target flashes),
# 54 subjects, 62 channels, 2 sessions (MOABB's train and test runs),
# cross-session: per subject, train on one session, test on the other.
# Too large to download on most workstations: run it on a cluster (cluster/drac).

architecture: EEGNet

data:
  dataset: Lee2019_ERP
  dataset_kwargs: {test_run: true}  # both runs of each session
  subjects: null  # all 54
  sfreq: 128  # Hz, after resampling from 1000 Hz; 1 s trials -> 128 samples
  l_freq: 1  # band-pass, Hz (MOABB's P300 default)
  h_freq: 24
  factor_new: 0.001  # exponential moving standardization
  init_block_size: 1000
  mapping: {NonTarget: 0, Target: 1}

evaluation:
  protocol: cross-session

metrics: [roc_auc, balanced_accuracy]

model:  # braindecode EEGNet arguments (PackedEEGNet takes the same ones)
  F1: 8
  D: 2
  kernel_length: 64  # 0.5 s at 128 Hz, the EEGNet paper's P300 setting
  depthwise_kernel_length: 16
  pool1_kernel_size: 4
  pool2_kernel_size: 8
  drop_prob: 0.25
  final_layer_with_constraint: true  # max-norm linear classifier, as in the EEGNet paper
  norm_rate: 0.25

train:
  seeds: [0]  # every seed repeats all 108 folds
  epochs: 100
  lr: 0.001  # Adam, cosine-annealed to 0
  batch_size: 64
  pack_size: 18
  class_weight: balanced  # each member's loss weighted by its training set's inverse class frequencies

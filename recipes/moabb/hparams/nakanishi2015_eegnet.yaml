# EEGNet on Nakanishi2015, 12-class SSVEP (9.25 to 14.75 Hz in 0.5 Hz steps),
# 9 subjects, 8 occipital channels, 1 session of 180 trials (15 per class),
# within-session: per subject, stratified 5-fold cross-validation.

architecture: EEGNet

data:
  dataset: Nakanishi2015
  subjects: null  # all 9
  sfreq: 128  # Hz, after resampling from 256 Hz; 4.15 s trials -> 531 samples
  l_freq: 5  # band-pass, Hz: the stimulation frequencies and their 2nd and 3rd harmonics
  h_freq: 45
  factor_new: 0.001  # exponential moving standardization
  init_block_size: 1000

evaluation:
  protocol: within-session
  n_folds: 5

metrics: [accuracy, kappa]

model:  # braindecode EEGNet arguments (PackedEEGNet takes the same ones)
  F1: 8
  D: 2
  kernel_length: 64  # 0.5 s at 128 Hz
  depthwise_kernel_length: 16
  pool1_kernel_size: 4
  pool2_kernel_size: 8
  drop_prob: 0.25
  final_layer_with_constraint: true  # max-norm linear classifier, as in the EEGNet paper
  norm_rate: 0.25

train:
  seeds: [0]  # every seed repeats all 45 folds
  epochs: 300
  lr: 0.001  # Adam, cosine-annealed to 0
  batch_size: 64
  pack_size: 15

# EEGNet on Lee2019_MI (OpenBMI), 2-class motor imagery (left vs right hand),
# 54 subjects, 62 channels, 2 sessions of 200 trials (MOABB's train and test runs),
# cross-session: per subject, train on one session, test on the other.

architecture: EEGNet

data:  # braindecode's MOABBDataset + preprocessing, as for BNCI2014001
  dataset: Lee2019_MI
  dataset_kwargs: {test_run: true}  # both runs of each session
  subjects: null  # all 54
  sfreq: 128  # Hz, after resampling from 1000 Hz; 4 s trials -> 512 samples
  l_freq: 4  # band-pass, Hz
  h_freq: 38
  factor_new: 0.001  # exponential moving standardization
  init_block_size: 1000

evaluation:
  protocol: cross-session

metrics: [accuracy, kappa]

model:  # braindecode EEGNet arguments (PackedEEGNet takes the same ones)
  F1: 8
  D: 2
  kernel_length: 64  # 0.5 s at 128 Hz
  depthwise_kernel_length: 16
  pool1_kernel_size: 4
  pool2_kernel_size: 8
  drop_prob: 0.25
  final_layer_with_constraint: true  # max-norm linear classifier, as in the EEGNet paper
  norm_rate: 0.25

train:
  seeds: [0]  # every seed repeats all 108 folds
  epochs: 300
  lr: 0.001  # Adam, cosine-annealed to 0
  batch_size: 64
  pack_size: 18

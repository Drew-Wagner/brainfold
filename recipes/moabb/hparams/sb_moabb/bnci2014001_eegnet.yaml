# SpeechBrain-MOABB's protocol for EEGNet on BNCI2014001 (sb_search.py), from
# benchmarks/MOABB/hparams/MotorImagery/BNCI2014001/EEGNet.yaml and
# run_hparam_optimization.sh (speechbrain/benchmarks, commit e602161 of speechbrain).
# Leave-one-session-out over all 9 subjects; their published result with this
# protocol is 0.7316 ± 0.0039 balanced accuracy (10 seeds).

dataset: BNCI2014_001
n_classes: 4
sample_rate: 125  # Hz, after MOABB's resampling
valid_ratio: 0.2
metric: acc  # balanced accuracy on the validation sessions, averaged over folds
seed: 1986  # TPE's seed, and every search trial's (their run_hparam_optimization.sh default)
final_seeds: 10  # the final evaluation: seeds 1986, 1987, ... over every fold
trials: 50  # per step (--exp_max_trials)
startup_trials: 20  # random trials before TPE (Orion's n_initial_points)
ei_candidates: 24
pack_size: 18  # folds trained as one PackedEEGNet

# Their hparams file's values, used where a step doesn't search them. The searched ones
# are their tuned results, kept for reference (and for sb_search.py --no-search).
fixed:
  fmin: 0.13
  fmax: 46.0
  tmin: 0.0
  tmax: 4.0
  n_steps_channel_selection: 2
  avg_models: 10
  number_of_epochs: 862
  lr: 0.0001
  batch_size_exponent: 4
  bn_momentum: 0.01  # not searched by SpeechBrain-MOABB: fixed in their EEGNet
  max_num_segments: 3
  amp_delta: 0.01742
  shift_delta_: 1  # not searched (their flag lacks the '@'): shifts of -2 to 1 samples
  snr_white_low: 15.0
  snr_white_delta: 19.1
  cnn_temporal_kernels: 61
  cnn_temporal_kernelsize: 51
  cnn_spatial_depth_multiplier: 4
  cnn_spatial_max_norm: 1.0
  cnn_spatial_pool: 4
  cnn_septemporal_point_kernels_ratio_: 7
  cnn_septemporal_kernelsize_: 15
  max_cnn_spatial_pool: 4
  cnn_septemporal_pool: 7
  dense_max_norm: 0.25
  dropout: 0.008464

# Their Orion priors, step by step. Step 1 trains without augmentation (their
# --repeat_augment 0); step 2 and the final evaluation with it. bn_momentum is ours.
search:
  step1:
    fmin: uniform(0.1, 5, precision=2)
    fmax: uniform(20.0, 50.0, precision=3)
    tmax: uniform(1.0, 4.0, precision=2)
    n_steps_channel_selection: uniform(1, 3, discrete=True)
    avg_models: uniform(1, 15, discrete=True)
    number_of_epochs: uniform(250, 1000, discrete=True)
    lr: choices([0.01, 0.005, 0.001, 0.0005, 0.0001])
    batch_size_exponent: uniform(4, 6, discrete=True)
    bn_momentum: loguniform(0.001, 1.0)
    cnn_temporal_kernels: uniform(4, 64, discrete=True)
    cnn_temporal_kernelsize: uniform(24, 62, discrete=True)
    cnn_spatial_depth_multiplier: uniform(1, 4, discrete=True)
    cnn_septemporal_point_kernels_ratio_: uniform(0, 8, discrete=True)
    cnn_septemporal_kernelsize_: uniform(3, 24, discrete=True)
    cnn_septemporal_pool: uniform(1, 8, discrete=True)
    dropout: uniform(0.0, 0.5)
  step2:
    max_num_segments: uniform(2, 6, discrete=True)
    amp_delta: uniform(0.0, 0.5)
    snr_white_low: uniform(0.0, 15, precision=2)
    snr_white_delta: uniform(5.0, 20.0, precision=3)

# --optimizer schedule-free: constant lr, so the number of epochs is chosen on the
# validation sets, every `every` epochs from `first` to `last` (their range), instead of
# searched; no checkpoint averaging; BatchNorm statistics recomputed before evaluating,
# which makes bn_momentum irrelevant.
schedule_free:
  not_searched: [number_of_epochs, avg_models, bn_momentum]
  epochs: {first: 250, last: 1000, every: 25}
